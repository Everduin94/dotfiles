"$schema" = 'https://starship.rs/config-schema.json'

# Slanted segments like the Neovim statusline. Left segments slope down, right
# ones slope up, and edges that touch the screen stay straight.
#
# Icons get an extra space after them because Ghostty draws an icon across the
# space that follows it.

add_newline = true
palette = "catppuccin_mocha"

format = """$directory$character"""
# $all comes first so the branch is always on the outside
right_format = """$all$env_var$cmd_duration${custom.branch}"""

[directory]
style = "bold fg:text bg:section"
format = "[ \U000f024b  $path ]($style)[$read_only]($read_only_style)[\ue0b8](fg:section)"
read_only = "\U000f033e "
read_only_style = "bold fg:red bg:section"

# Status block, hidden for now. Swap in the commented symbols to show it.
[character]
format = "$symbol "
success_symbol = ""
error_symbol = ""
# success_symbol = "[\ue0be](fg:section)[ \U000f0e1e  ](bold fg:green bg:section)[\ue0b8](fg:section)"
# error_symbol = "[\ue0be](fg:section)[ \U000f1398  ](bold fg:red bg:section)[\ue0b8](fg:section)"

[env_var.ZMX_SESSION]
format = "[\ue0ba](fg:section)[ \U000f165d  ](bold fg:teal bg:section)[\ue0bc](fg:section)"

[cmd_duration]
min_time = 2000
format = "[\ue0ba](fg:section)[ \U000f051b  $duration ](fg:subtext0 bg:section)[\ue0bc](fg:section)"

# Branch after the last `/` (everduin94/fix/154-x -> 154-x). git_branch can only
# truncate by length, so this is a custom module. Detached HEAD shows the hash.
[custom.branch]
require_repo = true
when = true
shell = ["sh"]
command = 'b=$(git branch --show-current 2>/dev/null); [ -n "$b" ] || b=$(git rev-parse --short HEAD 2>/dev/null); printf "%s" "${b##*/}"'
symbol = "\ue725  "
format = "[\ue0ba](fg:section)[ $symbol$output ](bold fg:text bg:section)"

[git_branch]
disabled = true

[golang]
format = "[\ue627 ](bold cyan)"

[git_status]
disabled = true

[git_commit]
disabled = true

[os]
disabled = true

[package]
disabled = true

[nodejs]
disabled = true

[palettes.catppuccin_mocha]
# segment bg, a little lighter than the terminal bg (base)
section = "#2a2b3c"
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
